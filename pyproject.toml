[project]
name = "agent-memory-mcp"
version = "0.1.0"
description = "Local Streamable HTTP MCP server for persistent agent memory"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.26,<2",
    "aiohttp>=3.9.0",
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "streamlit>=1.37.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
